services:
  # --- Infrastructure ---

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
    container_name: redpanda
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
    ports:
      - "19092:19092"
      - "18082:18082"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.6.0
    container_name: redpanda-console
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: spread_scanner
      POSTGRES_USER: scanner
      POSTGRES_PASSWORD: scanner_dev_pw
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanner -d spread_scanner"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Application Services ---

  ingestion-polymarket:
    build:
      context: .
      dockerfile: packages/ingestion-polymarket/Dockerfile
    container_name: ingestion-polymarket
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
      DATABASE_URL: postgresql://scanner:scanner_dev_pw@postgres:5432/spread_scanner
      POLL_INTERVAL_MS: "5000"
    restart: unless-stopped

  ingestion-kalshi:
    build:
      context: .
      dockerfile: packages/ingestion-kalshi/Dockerfile
    container_name: ingestion-kalshi
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
      DATABASE_URL: postgresql://scanner:scanner_dev_pw@postgres:5432/spread_scanner
      POLL_INTERVAL_MS: "5000"
    restart: unless-stopped

  normalizer:
    build:
      context: .
      dockerfile: packages/normalizer/Dockerfile
    container_name: normalizer
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
      DATABASE_URL: postgresql://scanner:scanner_dev_pw@postgres:5432/spread_scanner
      REDIS_URL: redis://redis:6379
    restart: unless-stopped

  spread-detector:
    build:
      context: .
      dockerfile: packages/spread-detector/Dockerfile
    container_name: spread-detector
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
      DATABASE_URL: postgresql://scanner:scanner_dev_pw@postgres:5432/spread_scanner
      REDIS_URL: redis://redis:6379
      SPREAD_THRESHOLD: "0.03"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    container_name: api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://scanner:scanner_dev_pw@postgres:5432/spread_scanner
      REDIS_URL: redis://redis:6379
      PORT: "3001"
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: packages/dashboard/Dockerfile
    container_name: dashboard
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    restart: unless-stopped

volumes:
  redpanda_data:
  postgres_data:
  redis_data:
